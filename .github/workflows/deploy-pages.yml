name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "artifacts/video-archive/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build frontend bundle
        run: pnpm --filter @workspace/video-archive run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy artifacts/video-archive/dist --project-name=chuglii --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # A green build is not a working site: the media proxy lives in
      # public/_worker.js, which CI never exercises. These four faults all
      # shipped to production while every test passed (wrong referer, redirect
      # to the origin, cached 403s, double-proxying through /api/player/stream).
      # Verify the deployed origin the way a browser does, and fail the deploy
      # if it regressed.
      - name: Smoke-test the deployed media path
        run: |
          for attempt in 1 2 3 4 5; do
            if node scripts/smoke-media.mjs --base "${{ vars.PUBLIC_SITE_URL || 'https://chuglii.in' }}"; then
              exit 0
            fi
            echo "attempt $attempt failed; edge may still be propagating, retrying in 15s"
            sleep 15
          done
          echo "::error::media smoke test failed against the deployed site"
          exit 1
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
